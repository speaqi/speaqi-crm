<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ufficio Speaqi</title>
<style>
:root{color-scheme:dark;--glass:#101826d9;--line:#ffffff1f;--ink:#f3efe7;--muted:#aab6c4;--accent:#ff8a4d;--navy:#16192e;font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#ece7df}[hidden]{display:none!important}h1,h2,h3,p{margin:0}
button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%}.viewport{position:relative;height:100%;overflow:hidden;background:#ece7df;transition:background .8s}.viewport[data-light=night]{background:#0c1322}
#stage{position:absolute;inset:0}#stage canvas{display:block;outline:none}.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.card{background:var(--glass);color:var(--ink);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px #0b101a40}
.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#ffc9a6;font-weight:700}

/* Adesso in ufficio: chi lavora, chi aspetta te. Ogni riga porta dalla persona. */
#now{position:absolute;top:14px;left:14px;width:min(318px,calc(100% - 28px));padding:11px 11px 9px;z-index:5}
#now header{display:flex;align-items:center;gap:8px;margin:0 3px 8px}#now header b i{font-style:normal}#now header b{font-family:"Heuvel Grotesk","Inter",sans-serif;font-weight:400;font-size:16px;letter-spacing:-.2px;flex:1;white-space:nowrap}
#now header span{display:flex;gap:9px;font-size:11px;color:#dfe6ee;font-variant-numeric:tabular-nums;font-weight:700}#now header span i{font-style:normal;display:flex;align-items:center;gap:4px}#now header span i::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
#now-toggle{border:0;background:#ffffff14;border-radius:7px;width:24px;height:24px;color:var(--ink);font-size:12px;line-height:1;flex:none}#now-toggle:hover{background:#ffffff2b}#now.shut{width:auto}#now.shut header{margin:0}#now.shut #now-body{display:none}
#now-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.now-row{width:100%;display:grid;grid-template-columns:20px minmax(0,1fr) 12px;gap:8px;align-items:center;text-align:left;border:1px solid transparent;background:#ffffff0a;border-radius:9px;padding:6px 8px;color:var(--ink)}
.now-row:hover{background:#ffffff17;border-color:#ffffff2e}.now-row .ico{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0d1420}
.now-row b{display:block;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now-row span span{display:block;font-size:10.5px;color:#c9d3de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-row .go{color:#ffffff66;font-size:13px}.now-row:hover .go{color:var(--accent)}.now-row[data-state=attention]{background:#ffb54717;border-color:#ffb54745}.now-row[data-state=attention] span span{color:#ffd9a0}
.now-rest{font-size:10.5px;color:var(--muted);padding:5px 4px 0;display:flex;gap:10px;flex-wrap:wrap}.now-rest i{font-style:normal;display:flex;gap:5px;align-items:center}.now-rest i::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.now-empty{font-size:12px;color:var(--muted);padding:4px;line-height:1.5}.now-error{font-size:11px;color:#ffd9a0;background:#ffb5471c;border:1px solid #ffb54755;border-radius:8px;padding:6px 8px;margin-top:6px;line-height:1.4}

/* La zona aperta e il ritorno alla vista completa. */
#crumb{position:absolute;top:14px;left:344px;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 6px;z-index:5;max-width:calc(100% - 358px)}
#crumb button{border:0;background:#f4efe4;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;color:#16192e;white-space:nowrap}#crumb button:hover{background:#fff}
#crumb div{min-width:0;padding-right:8px}#crumb b{display:block;font-family:"Heuvel Grotesk","Inter",sans-serif;font-weight:400;font-size:15px;letter-spacing:.6px;white-space:nowrap}#crumb span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#crumb .sw{width:26px;height:26px;border-radius:8px;background:var(--c);display:grid;place-items:center;color:#fff;flex:none}

/* Barra delle zone: l'elenco dei posti dove si può entrare. */
#dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:3px;padding:5px;z-index:5;max-width:calc(100% - 28px);overflow-x:auto;scrollbar-width:none}#dock::-webkit-scrollbar{display:none}
.dock-chip{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:9px;padding:6px 9px;font-size:11.5px;font-weight:500;color:#d5dde6;white-space:nowrap;flex:none}
.dock-chip:hover{background:#ffffff14;color:#fff}.dock-chip[aria-pressed=true]{background:#f4efe4;color:#16192e;font-weight:700}
.dock-chip .sw{width:20px;height:20px;border-radius:6px;background:var(--c);display:grid;place-items:center;color:#fff;flex:none}
.dock-chip em{font-style:normal;font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px;font-variant-numeric:tabular-nums}.dock-chip em.run{background:#43d18a;color:#06301b}.dock-chip em.warn{background:#ffb547;color:#3a2500}
.dock-chip.wait{background:#ff5a1f;color:#fff;font-weight:700}.dock-chip.wait:hover{background:#ff6d38}.dock-chip.wait em{background:#fff;color:#c23c0a}.dock-chip.wait.zero{background:#ffffff14;color:#d5dde6}.dock-chip.wait.zero em{background:#ffffff2b;color:#fff}
.dock-sep{width:1px;background:var(--line);margin:4px 3px;flex:none}

.scene-tools{position:absolute;top:56px;right:14px;display:flex;gap:6px;align-items:center;z-index:5}
.tool{border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:7px 10px;border-radius:10px;font-size:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap}.tool:hover{background:#1b2638}.tool[aria-expanded=true]{background:#f4efe4;color:#16192e}#replay-ico{font-weight:500}#labels-toggle::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#43d18a;vertical-align:1px}#labels-toggle[aria-pressed=false]::before{background:#6b7684}#labels-toggle[aria-pressed=false]{color:var(--muted)}
.segment{display:flex;gap:2px;background:var(--glass);border:1px solid var(--line);padding:3px;border-radius:10px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.segment button{border:0;background:none;border-radius:7px;color:var(--muted);padding:5px 9px;font-size:12px;white-space:nowrap}.segment button[aria-pressed=true]{background:#f4efe4;color:#16192e;font-weight:700}
#legend{position:absolute;right:14px;top:100px;z-index:6;padding:11px 13px;display:grid;gap:6px;font-size:11.5px;color:#e3e9ef;width:290px}
#legend span{display:flex;gap:8px;align-items:center}#legend i{width:18px;height:18px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#0d1420;flex:none}#legend small{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5;padding-top:7px;border-top:1px solid var(--line)}

/* Suggerimento al passaggio del mouse: cos'è, cosa fa, cosa succede se clicchi. */
#tip{position:absolute;z-index:9;pointer-events:none;width:max-content;max-width:290px;padding:10px 12px;font-size:12px;line-height:1.45}
#tip .th{display:flex;align-items:center;gap:8px;margin-bottom:5px}#tip .th .ico{width:24px;height:24px;border-radius:8px;background:var(--c);display:grid;place-items:center;color:#fff;flex:none}#tip .th b{font-size:13px}
#tip .st{margin-left:auto;font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px;background:var(--c);color:#0d1420;white-space:nowrap}
#tip p{color:#c9d3de}#tip p.nowline{color:#fff;margin-top:4px}#tip small{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);color:#ffc9a6;font-size:11px;font-weight:700}
#tip .dots{display:flex;gap:4px;margin:6px 0 2px}#tip .dots i{width:12px;height:12px;border-radius:50%}

/* Etichette ancorate al 3D. Chi si accavalla a un'etichetta più importante lascia il posto (.yield). Con «Etichette» spento spariscono tutte. */
.nolabels .labels{display:none}
.yield{visibility:hidden!important;pointer-events:none!important}
.tag{display:flex;align-items:center;gap:6px;color:#f3efe7;font-size:11px;font-weight:700;border:1px solid #ffffff2b;padding:5px 9px 5px 7px;border-radius:999px;background:#131b2be6;box-shadow:0 4px 14px #0b101a47;white-space:nowrap;pointer-events:auto;cursor:pointer;transition:scale .2s,opacity .3s,background .2s}
.tag:hover{scale:1.07;background:#1c2740}.tag i{display:block;width:8px;height:8px;border-radius:3px;background:var(--c)}.tag b{font-size:10.5px;font-weight:500;color:#b9c5d2;margin-left:2px}
.tag.dim{opacity:.7}.tag.cur{visibility:hidden;pointer-events:none}
.tag.busy b{color:#7af0b0}.tag.alarm{border-color:#ffb547;background:#3a2a10f2}.tag.alarm b{color:#ffd08a}
.tag.kiosk{background:#ff5a1f;border-color:#ffffff66;padding:6px 11px 6px 10px;font-size:12.5px;animation:beat 2.4s ease-in-out infinite}
.tag.kiosk:hover{background:#ff6d38}.tag.kiosk i{background:#fff;border-radius:50%}.tag.kiosk b{color:#c23c0a;background:#fff;border-radius:999px;padding:0 7px;font-size:12px;font-weight:700;margin-left:4px}
.tag.kiosk em{display:none}.tag.kiosk.empty{background:#131b2be6;animation:none}.tag.kiosk.empty b{background:#ffffff2b;color:#fff}
.tag.cities{background:#16324ae6}
@keyframes beat{0%,100%{box-shadow:0 4px 14px #0b101a47,0 0 0 0 #ff5a1f88}50%{box-shadow:0 4px 14px #0b101a47,0 0 0 9px #ff5a1f00}}
/* Persone: da lontano il nome con il pallino dello stato; nella zona aperta, il cartellino con quello che stanno facendo. */
.person-tag{display:flex;align-items:center;gap:5px;font-size:10px;color:#16192e;background:#ffffffe6;padding:3px 8px 3px 6px;border-radius:999px;border:1px solid #16192e24;max-width:150px;text-align:left;line-height:1.3;pointer-events:auto;cursor:pointer;box-shadow:0 3px 10px #0b101a33;transition:scale .2s,background .2s}
.person-tag:hover{scale:1.06}.person-tag i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}.person-tag b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.person-tag span{display:none}.person-tag[data-state=off]{color:#5b6672;background:#ffffffbf}
.person-tag.task{color:#fff;font-size:10.5px;padding:4px 9px 4px 7px}.person-tag.task[data-state=running]{border-color:#43d18a;background:#0f2a1ef5}.person-tag.task[data-state=attention]{border-color:#ffb547;background:#3a2a10f7}
.person-tag.near{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:6px;font-size:11px;color:#fff;background:#131b2bf2;padding:5px 9px 6px 7px;border-radius:11px;border-color:#ffffff2b;max-width:206px;box-shadow:0 4px 14px #0b101a47;z-index:100000!important}
.person-tag.near span{grid-column:2;color:#b9c5d2;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person-tag.near span.line{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;color:#eaf0f6}
.person-tag.near:hover span,.person-tag.near.sel span{display:block}.person-tag.near:hover span.line,.person-tag.near.sel span.line{display:-webkit-box}
.person-tag.near[data-state=running]{border-color:#43d18a;background:#0f2a1ef5}.person-tag.near[data-state=attention]{border-color:#ffb547;background:#3a2a10f7}.person-tag.near[data-state=attention] span.line{color:#ffd9a0}.person-tag.near[data-state=off]{color:#d5dde6;background:#131b2bd9}
.person-tag.sel,.person-tag.near.sel{background:#f4efe4;color:#16192e;border-color:#fff;z-index:100001!important}.person-tag.near.sel span{color:#4b566a}.person-tag.near.sel span.line{color:#16192e}
.person-tag[data-state=replay],.person-tag.near[data-state=replay]{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:6px;color:#fff;border-color:#fff;background:#4f6ef7;max-width:240px;border-radius:11px;padding:5px 9px 6px 7px;z-index:100003!important}
.person-tag[data-state=replay] span.line{display:block;grid-column:2;color:#fff;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person-tag.ceo{background:#ffd27a;color:#16192e;border-color:#fff;pointer-events:none}
.task-tag{display:grid;gap:2px;font-size:10.5px;color:#fff;background:#131b2bf0;padding:6px 9px;border-radius:10px;border:1px solid #ffffff2b;max-width:250px;pointer-events:none;line-height:1.3;box-shadow:0 4px 14px #0b101a47}
.task-tag b{font-weight:700}.task-tag span{color:#b9c6cf;font-size:10px}.task-tag[data-state=running]{border-color:#ff8a4d;background:#3b1c0ef2}.task-tag[data-state=attention]{border-color:#ff4d3d;background:#4a1612f5}
.task-tag[data-state=idle],.task-tag[data-state=done]{visibility:hidden}
.hint{display:flex;align-items:center;gap:8px;background:#fff;color:#16192e;font-size:12px;font-weight:700;padding:7px 12px 7px 8px;border-radius:999px;box-shadow:0 8px 24px #0b101a59;white-space:nowrap;pointer-events:none;z-index:200000!important;animation:bob 1.6s ease-in-out infinite}
.hint::before{content:"";width:20px;height:20px;border-radius:50%;background:#ff5a1f;box-shadow:0 0 0 0 #ff5a1f99;animation:ping 1.6s ease-out infinite;flex:none}.hint::after{content:"";position:absolute;left:50%;bottom:-5px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}
@keyframes ping{0%{box-shadow:0 0 0 0 #ff5a1f99}100%{box-shadow:0 0 0 12px #ff5a1f00}}@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-6px}}
.city-card{pointer-events:auto;background:#fff;color:#16192e;border-radius:12px;padding:12px 14px;width:230px;box-shadow:0 8px 28px #0006;font-size:11px;display:grid;gap:6px;position:relative;z-index:150000!important}.city-card strong{font-size:14px}.city-card small{color:#5b6672}.city-card p{color:#33404d;line-height:1.4}
.city-card .dots{display:flex;gap:4px}.city-card .dots i{width:14px;height:14px;border-radius:50%}.city-card [data-close]{position:absolute;top:6px;right:8px;border:0;background:none;font-size:16px;color:#5b6672}.city-card .go{border:0;background:#16192e;color:#fff;border-radius:7px;padding:8px;font-weight:700;font-size:11px}

#replay-line{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;width:min(560px,calc(100% - 28px));padding:9px 12px;font-size:12px;z-index:6}#replay-line div{height:3px;background:#ffffff1f;border-radius:3px;margin-top:7px;overflow:hidden}#replay-bar{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
#fallback{position:absolute;left:14px;top:14px;padding:18px;max-width:350px;line-height:1.6;color:var(--ink);z-index:8}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#5b6672;font-size:13px;z-index:3;pointer-events:none;transition:opacity .5s}#loading.done{opacity:0}

@media(max-width:1180px){.dock-chip:not(.wait):not([aria-pressed=true]) .nm{display:none}.dock-chip{padding:6px 7px}}
@media(max-width:1180px){#crumb{left:14px;top:auto;bottom:64px;max-width:calc(100% - 28px)}}
@media(max-width:1000px){.tool .tx{display:none}#labels-toggle::before{margin-right:0}#now{width:min(286px,calc(100% - 28px))}.segment button{padding:5px 7px}}
@media(max-width:700px){#now{top:10px;left:10px;width:auto;max-width:calc(100% - 20px);padding:7px 8px}#now header{margin:0}#now header b{font-size:13.5px}#now:not(.shut){width:calc(100% - 20px)}
#now.shut header b i{display:none}#crumb{top:52px;bottom:auto;left:10px;max-width:calc(100% - 20px)}#dock{left:10px;right:10px;transform:none;bottom:52px;max-width:none}.dock-chip .nm{display:inline!important}
.scene-tools{top:auto;right:auto;left:10px;bottom:10px;gap:5px}.tool{padding:7px 9px;font-size:11px}.segment button{padding:5px 8px;font-size:11px}#legend{top:auto;right:10px;left:10px;bottom:100px;width:auto}#replay-line{bottom:100px}
.tag{font-size:10px;padding:4px 7px 4px 6px}.tag b{display:none}.tag.alarm b,.tag.busy b,.tag.kiosk b{display:inline}.person-tag.near{max-width:180px}#tip{display:none!important}.hint{font-size:11px}}
@media(max-width:420px){#now.shut header b{display:none}#now.shut{padding:6px 7px}}
@media(prefers-reduced-motion:reduce){.tag.kiosk,.hint,.hint::before{animation:none}*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <main class="viewport" data-light="day" data-far="true" aria-label="Ufficio Speaqi in 3D">
    <div id="stage" aria-label="Trascina per ruotare, usa lo zoom per avvicinarti"></div>
    <div id="loading">Apro l’ufficio…</div>
    <section id="now" class="card" aria-label="Adesso in ufficio">
      <header><b>Adesso<i> in ufficio</i></b><span id="now-count"></span><button type="button" id="now-toggle" aria-expanded="true" aria-label="Mostra o nascondi cosa succede adesso">▴</button></header>
      <div id="now-body"><ul id="now-list"><li class="now-empty">Leggo agenti e attività dal CRM…</li></ul></div>
    </section>
    <div id="crumb" class="card" hidden></div>
    <nav id="dock" class="card" aria-label="Zone dell’ufficio"></nav>
    <div class="scene-tools">
      <button type="button" class="tool" id="reset" title="Torna a vedere tutto l’ufficio" aria-label="Vista completa">↺<span class="tx"> Vista completa</span></button>
      <div class="segment" role="group" aria-label="Illuminazione"><button type="button" data-light="day" aria-pressed="true">Giorno</button><button type="button" data-light="night" aria-pressed="false">Sera</button></div>
      <button type="button" class="tool" id="replay" title="Ripassa le corse di oggi, una alla volta" aria-label="Rivedi oggi"><b id="replay-ico">▶</b><span class="tx"> Rivedi oggi</span></button>
      <button type="button" class="tool" id="labels-toggle" aria-pressed="true" title="Nascondi tutte le etichette" aria-label="Etichette"><span class="tx">Etichette</span></button>
      <button type="button" class="tool" id="help" aria-expanded="false" aria-controls="legend" title="Come si legge l’ufficio">?</button>
    </div>
    <div class="card" id="legend" hidden></div>
    <div id="replay-line" class="card" hidden role="status"><span id="replay-text"></span><div><i id="replay-bar"></i></div></div>
    <div id="tip" class="card" hidden role="tooltip"></div>
    <div id="fallback" class="card" hidden>Il 3D non è disponibile in questo browser. Agenti, proposte e Direttore sono nel pannello a destra.</div>
  </main>
</div>
<!-- SCENE_SCRIPT -->
</body>
</html>
